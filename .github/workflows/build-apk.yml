name: Fabriquer l'APK Android

on:
  workflow_dispatch: {}
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Accepter les licences du SDK Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Fabriquer l'APK
        run: |
          DIR=$(dirname "$(find . -name settings.gradle.kts | head -1)")
          echo "Projet trouve dans : $DIR"
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/MAXItv.apk"

      - name: Garder une copie téléchargeable (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: MAXItv-apk
          path: MAXItv.apk

      - name: Publier l'APK à une adresse fixe (Releases)
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: MAXI tv (dernière version)
          body: APK Android natif pour Fire TV, Bbox TV et téléphone.
          artifacts: MAXItv.apk
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
